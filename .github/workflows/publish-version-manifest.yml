name: Publish version manifest fallback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.4.20'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild version.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION_NAME="${TAG#v}"
          SOURCE_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$VERSION_NAME" = "$SOURCE_NAME"

          APK_NAME="SUP_Place_${VERSION_NAME}.apk"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME" \
            --dir "$RUNNER_TEMP/release"

          SHA="$(sha256sum "$RUNNER_TEMP/release/$APK_NAME" | awk '{print toupper($1)}')"
          export VERSION_NAME VERSION_CODE SHA

          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION_NAME"]
          notes = Path("release-notes.txt").read_text(encoding="utf-8").strip() if Path("release-notes.txt").exists() else ""
          data = {
              "version": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": version,
              "apkUrl": f"https://github.com/InfTv/SUP-Place/releases/download/v{version}/SUP_Place_{version}.apk",
              "changelog": notes,
              "sha256": os.environ["SHA"],
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild ${TAG} version manifest"
          git push origin HEAD:main
