name: Build and publish SUP Place

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'release-notes.txt'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

concurrency:
  group: supplace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Regression tests
        run: |
          node tests/report-migration.test.mjs
          node tests/rental-rules.test.mjs
          node tests/version-manifest.test.mjs
          node tests/update-ui.test.mjs
          node tests/native-updater-source.test.mjs
          node tests/update-timeout.test.mjs
          node tests/report-restore.test.mjs
          node tests/background-update.test.mjs
          node tests/cloud-sync.test.mjs

      - name: Read release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^" ]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          PUBLISHED_CODE="$(python - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(int(json.load(f)['versionCode']))
          PY
          )"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=SUP_Place_${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          if [ "$VERSION_CODE" -gt "$PUBLISHED_CODE" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish: source=$VERSION_CODE published=$PUBLISHED_CODE"
          fi

      - name: Build unsigned release APK
        if: steps.meta.outputs.release_needed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        if: steps.meta.outputs.release_needed == 'true'
        env:
          RELEASE_KEY_B64: ${{ secrets.SUP_PLACE_RELEASE_KEY_B64 }}
          RELEASE_PASSWORD_B64: ${{ secrets.SUP_PLACE_RELEASE_PASSWORD_B64 }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          EXPECTED_CODE: ${{ steps.meta.outputs.version_code }}
          EXPECTED_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEY_B64"
          test -n "$RELEASE_PASSWORD_B64"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          KS="$RUNNER_TEMP/supplace-release.p12"
          ALIGNED="$RUNNER_TEMP/supplace-aligned.apk"

          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > "$KS"
          SUP_PLACE_STORE_PASSWORD="$(printf '%s' "$RELEASE_PASSWORD_B64" | base64 --decode)"
          export SUP_PLACE_STORE_PASSWORD

          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-type PKCS12 \
            --ks-key-alias supplace \
            --ks-pass env:SUP_PLACE_STORE_PASSWORD \
            --key-pass env:SUP_PLACE_STORE_PASSWORD \
            --out "$APK_NAME" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME"
          CERT="$("$BT/apksigner" verify --print-certs "$APK_NAME" | awk '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          test "$CERT" = "fc9c498461213f9efd9b0ceea9d24898f357d22245183f8e10b03f0294e983ca"

          BADGING="$("$BT/aapt" dump badging "$APK_NAME" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.supplace.app'"
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'"
          echo "$BADGING" | grep -q "versionName='$EXPECTED_NAME'"

      - name: Create GitHub release
        if: steps.meta.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SUP Place $VERSION_NAME" \
            --notes-file release-notes.txt

      - name: Publish version.json
        if: steps.meta.outputs.release_needed == 'true'
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$APK_NAME" | awk '{print toupper($1)}')"
          export SHA

          python - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ['VERSION_NAME']
          notes = Path('release-notes.txt').read_text(encoding='utf-8').strip() if Path('release-notes.txt').exists() else ''
          data = {
              'version': version,
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': version,
              'apkUrl': f'https://github.com/InfTv/SUP-Place/releases/download/v{version}/SUP_Place_{version}.apk',
              'changelog': notes,
              'sha256': os.environ['SHA'],
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish v${VERSION_NAME} version manifest"
          git push origin HEAD:main
