<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>SUP Place</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6d7585;--line:#e6e9ef;--accent:#1769ff;--accent2:#eaf1ff;--warn:#a86500;--warnbg:#fff4d8;--danger:#b42318;--dangerbg:#feeceb;--ok:#087a55;--okbg:#e7f7f1;--shadow:0 2px 12px rgba(20,35,60,.08);--r:18px;--android-status-inset:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:90px}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.96);backdrop-filter:blur(12px);padding:calc(10px + max(env(safe-area-inset-top),var(--android-status-inset))) 16px 10px;border-bottom:1px solid rgba(230,233,239,.8)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand-left{display:flex;align-items:center;gap:8px;min-width:0}.backbtn{display:none;width:40px;height:40px;border:0;border-radius:12px;background:#e9edf5;color:var(--text);font-size:29px;line-height:1;font-weight:700;align-items:center;justify-content:center;padding:0 0 3px}.backbtn.show{display:flex}.brand h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.5px}.status{font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}.date{font-size:13px;color:var(--muted);margin-top:3px}
main{padding:12px 14px 24px;max-width:760px;margin:auto}.section{margin:12px 0 18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.section-title{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#566074}.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:750;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.name{font-weight:800;font-size:16px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.count{font-weight:850;font-size:16px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:750;background:#eef1f6;color:#4e596b}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.danger{background:var(--dangerbg);color:var(--danger)}.pill.ok{background:var(--okbg);color:var(--ok)}
.action{border:0;border-radius:13px;padding:10px 13px;background:var(--accent2);color:var(--accent);font-weight:800;min-height:42px}.action.primary{background:var(--accent);color:#fff}.action.danger{background:var(--dangerbg);color:var(--danger)}.action.gray{background:#edf0f5;color:#3f4857}.action:active{transform:scale(.98)}.action:disabled{opacity:.55;cursor:default;transform:none}
.big-add{position:sticky;bottom:82px;z-index:8;width:100%;height:55px;border:0;border-radius:17px;background:var(--accent);color:white;font-weight:850;font-size:16px;box-shadow:0 8px 22px rgba(23,105,255,.28);margin:12px 0 4px}.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(20,35,60,.06)}.nav button{border:0;background:transparent;color:#727b89;font-size:11px;font-weight:750;padding:5px 1px}.nav .ico{font-size:20px;display:block;margin-bottom:1px}.nav button.active{color:var(--accent)}
.page{display:none}.page.active{display:block}.hero-note{padding:11px 13px;border-radius:15px;background:var(--warnbg);color:#7d5100;font-size:13px;font-weight:650;margin-bottom:10px}.rental-time{font-size:24px;font-weight:850;letter-spacing:-.4px}.arrow{color:#9ca3af}.price{font-weight:900;font-size:18px}.muted{color:var(--muted)}
.modal-wrap{display:none;position:fixed;inset:0;z-index:50;background:rgba(19,27,43,.42);align-items:flex-end;justify-content:center}.modal-wrap.show{display:flex}.modal{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px rgba(0,0,0,.15)}.grab{width:42px;height:5px;border-radius:6px;background:#d8dbe1;margin:0 auto 12px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal h2{margin:4px 0 14px;font-size:22px}.x{border:0;background:#f0f2f6;border-radius:50%;width:38px;height:38px;font-size:20px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:#687284;font-weight:800;margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.04em}.input{width:100%;border:1px solid #dfe3ea;border-radius:13px;padding:12px 13px;background:white;color:var(--text);outline:none;min-height:46px}.input:focus{border-color:#8db5ff;box-shadow:0 0 0 3px #e9f1ff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item-step{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item-step:last-child{border-bottom:0}.step{width:40px;height:40px;border:0;border-radius:12px;background:#eef2f8;font-size:22px;font-weight:800}.q{width:30px;text-align:center;font-weight:900}.save{width:100%;height:52px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:850;font-size:16px;margin-top:14px}.save.secondary{background:#eef2f8;color:#344054}.save.danger{background:var(--danger);color:white}
.calc{background:#f7f9fc;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.calc-line{display:flex;justify-content:space-between;gap:10px;margin:7px 0;font-size:14px}.calc-total{font-size:19px;font-weight:900;padding-top:8px;border-top:1px solid var(--line)}
.tariff-grid{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;padding:12px 13px;border-bottom:1px solid var(--line)}.tariff-grid:last-child{border-bottom:0}.tariff-grid .input{padding:9px;min-height:40px;text-align:right}.hdr{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.history-tag{font-size:12px;font-weight:800;color:var(--muted)}.danger-text{color:var(--danger)}.hist-actions{display:flex;align-items:center;gap:7px}.histdel{width:38px;height:38px;border:0;border-radius:11px;background:var(--dangerbg);color:var(--danger);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}.danger-note{font-size:13px;line-height:1.4;color:var(--muted);margin:2px 0 8px}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}.report-btn{border:0;border-radius:14px;min-height:48px;font-weight:850;font-size:14px;padding:10px 12px}.report-btn.send{background:var(--accent);color:#fff}.report-btn.import{background:var(--accent2);color:var(--accent)}.report-card{padding:13px 14px;border-bottom:1px solid var(--line)}.report-card:last-child{border-bottom:0}.report-top{display:flex;align-items:flex-start;gap:10px}.report-meta{flex:1;min-width:0}.report-card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.report-card-actions .action{width:100%;min-width:0;min-height:40px;padding:8px 7px;font-size:13px}.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.report-stat{background:#f5f7fb;border-radius:11px;padding:8px;text-align:center}.report-stat b{display:block;font-size:16px}.report-stat span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.report-history{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px}.report-note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}.update-panel{padding:14px}.update-panel .action{width:100%;margin-top:10px}.update-message{font-size:13px;color:var(--muted);line-height:1.4;margin-top:6px;white-space:pre-line}.update-available{color:var(--ok);font-weight:800}.update-progress{height:6px;border-radius:999px;background:#e7ebf2;overflow:hidden;margin-top:10px}.update-progress::after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent);animation:updateSlide 1.1s ease-in-out infinite}@keyframes updateSlide{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:95px;background:#202938;color:white;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);display:none;max-width:90%}.toast.show{display:block}
@media(min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:24px;max-height:88vh}.nav{left:50%;transform:translateX(-50%);max-width:760px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.big-add{bottom:82px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="brand-left"><button id="topBack" class="backbtn" onclick="goAppBack()" aria-label="Назад">‹</button><div><h1>SUP Place</h1><div class="date" id="todayDate"></div></div></div><div class="status">● данные на телефоне</div></div></header>
<main>
<section id="pageToday" class="page active"></section>
<section id="pageBookings" class="page"></section>
<section id="pageTariffs" class="page"></section>
<section id="pageHistory" class="page"></section>
</main>
<nav class="nav">
<button data-page="Today" class="active"><span class="ico">☀️</span>Сегодня</button>
<button data-page="Bookings"><span class="ico">📅</span>Брони</button>
<button data-page="Tariffs"><span class="ico">₴</span>Тарифы</button>
<button data-page="History"><span class="ico">🕘</span>История</button>
</nav>
<div id="modal" class="modal-wrap"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script>

(()=>{if(typeof navigator==='undefined'||typeof document==='undefined')return;const m=/Android\s+(\d+)/i.exec(navigator.userAgent);if(m&&Number(m[1])>=15)document.documentElement.style.setProperty('--android-status-inset','24px')})();

const TYPES=[
 {id:'sup1',name:'SUP · 1 место',icon:'🏄',short:'SUP 👤'},
 {id:'sup2',name:'SUP · 2 места',icon:'🏄‍♂️',short:'SUP 👥'},
 {id:'kayak1',name:'Каяк · 1 место',icon:'🛶',short:'Каяк 👤'},
 {id:'kayak2',name:'Каяк · 2 места',icon:'🛶',short:'Каяк 👥'}
];
const KEY='supplace_state_v1';
const BACKUP_KEY='supplace_state_backup_v1';
const REPORTS_KEY='supplace_received_reports_v1';
const UPDATE_CHECK_KEY='supplace_last_update_check_v1';
const APP_VERSION='0.4.12';
let U={status:'idle',available:false,versionName:'',apkUrl:'',sha256:'',changelog:'',message:''};
const blankTariffs=()=>({sup1:{p60:null},sup2:{p60:null},kayak1:{p60:null},kayak2:{p60:null}});
const fresh=()=>({schemaVersion:5,inventory:{sup1:8,sup2:2,kayak1:2,kayak2:2},tariffs:blankTariffs(),rentals:[],bookings:[],history:[],seq:1});
let S=load(); let R=loadReports(); let timer; let currentPage='Today';
function loadReports(){try{let x=JSON.parse(localStorage.getItem(REPORTS_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function saveReports(){
  let max=Math.min(R.length,10);
  for(let n=max;n>=1;n--){
    try{localStorage.setItem(REPORTS_KEY,JSON.stringify(R.slice(0,n)));if(n<R.length)R=R.slice(0,n);return true}catch(e){}
  }
  if(!R.length){try{localStorage.setItem(REPORTS_KEY,'[]');return true}catch(e){}}
  return false
}
function migrateState(s){
 if(!s||typeof s!=='object')s={};
 if(!s.inventory)s.inventory={};
 for(let t of TYPES)if(s.inventory[t.id]==null)s.inventory[t.id]=0;
 if(!Array.isArray(s.rentals))s.rentals=[];
 if(!Array.isArray(s.bookings))s.bookings=[];
 if(!Array.isArray(s.history))s.history=[];
 if(!s.seq)s.seq=1;
 // Старую демо-тарификацию v0.1 очищаем один раз.
 if(!s.schemaVersion||s.schemaVersion<2){s.schemaVersion=2;s.tariffs={sup1:{p30:null},sup2:{p30:null},kayak1:{p30:null},kayak2:{p30:null}}}
 if(!s.tariffs)s.tariffs={};
 // v0.3: основной тариф теперь за 1 час.
 if(s.schemaVersion<3){
  for(let t of TYPES){let old=s.tariffs[t.id]||{};let p30=old.p30==null?null:Number(old.p30);s.tariffs[t.id]={p60:p30==null?null:Math.max(0,p30*2)}}
  s.schemaVersion=3;
 }
 for(let t of TYPES){if(!s.tariffs[t.id])s.tariffs[t.id]={p60:null};if(!('p60' in s.tariffs[t.id]))s.tariffs[t.id].p60=null}
 // v0.4.3: активный прокат сам является источником истины для старта.
 if(s.schemaVersion<4){s.history=s.history.filter(h=>h.kind!=='start'&&h.kind!=='booking_start');s.schemaVersion=4}
 // v0.4.8: предоплата и заметки. Старые отчёты получают безопасные значения по умолчанию.
 for(let r of s.rentals){if(r.prepaid==null)r.prepaid=0;if(r.note==null)r.note=''}
 for(let b of s.bookings){if(b.prepaid==null)b.prepaid=0;if(b.note==null)b.note=''}
 for(let h of s.history){if(h.kind==='finish'){if(h.prepaid==null)h.prepaid=0;if(h.note==null)h.note=''}}
 if(s.schemaVersion<5)s.schemaVersion=5;
 return s
}
function load(){
 for(let key of [KEY,BACKUP_KEY]){
  try{let raw=localStorage.getItem(key);if(!raw)continue;let s=JSON.parse(raw);if(s&&typeof s==='object')return migrateState(s)}catch(e){}
 }
 return fresh()
}
function save(){
 try{
  let next=JSON.stringify(S),prev=localStorage.getItem(KEY);
  if(prev&&prev!==next){try{let parsed=JSON.parse(prev);if(parsed&&typeof parsed==='object')localStorage.setItem(BACKUP_KEY,prev)}catch(e){}}
  localStorage.setItem(KEY,next);
  return true
 }catch(e){toast('⚠️ Не удалось сохранить данные');return false}
}
function id(){return Date.now().toString(36)+(S.seq++).toString(36)}
function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function type(id){return TYPES.find(x=>x.id===id)}
function dateKey(ms=Date.now()){let d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(ms){let d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function round5(ms){return Math.round(Number(ms)/300000)*300000}
function hm5(ms){return hm(round5(ms))}
function duration(min){min=Math.max(0,Math.round(min));if(min<60)return min+' мин';let h=Math.floor(min/60),m=min%60;return h+' ч'+(m?' '+m+' мин':'')}
function elapsed(a,b=Date.now()){let m=Math.max(0,(b-a)/60000);return Math.round(m/5)*5}
function billedMinutes(m){m=Math.max(0,Math.round(m));if(m<10)return 0;if(m<30)return 15;return Math.floor((m+15)/30)*30}
function billFor(items,bm){let total=0;for(const [tid,q] of Object.entries(items)){if(!q)continue;let t=S.tariffs[tid]||{p60:null};let p60=Number(t.p60)||0;let unit=bm===0?0:(bm/60)*p60;total+=unit*q}return Math.round(total*100)/100}
function money(n){n=Number(n)||0;return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}
function paymentBreakdown(total,prepaid){total=Math.max(0,Number(total)||0);prepaid=Math.max(0,Number(prepaid)||0);return {total,prepaid,left:Math.max(0,total-prepaid),over:Math.max(0,prepaid-total)}}
function activeQty(tid){return S.rentals.reduce((n,r)=>n+(r.items[tid]||0),0)}
function freeQty(tid){return Math.max(0,(S.inventory[tid]||0)-activeQty(tid))}
function itemText(items){return TYPES.filter(t=>items[t.id]>0).map(t=>`${items[t.id]} × ${t.name}`).join(' · ')}
function toast(msg){let x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2200)}
function setPage(name,push=true){
 if(!document.getElementById('page'+name))name='Today';
 if(push&&name!==currentPage)history.pushState({page:name},'', '#'+name);
 currentPage=name;
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById('page'+name).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));
 document.getElementById('topBack').classList.toggle('show',name!=='Today');
 render()
}
function goAppBack(){if(currentPage==='Today')return; if(history.state&&history.state.page===currentPage)history.back();else setPage('Today',false)}
window.addEventListener('popstate',e=>setPage((e.state&&e.state.page)||'Today',false));
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
history.replaceState({page:'Today'},'', '#Today');
function closeModal(){document.getElementById('modal').classList.remove('show')}
function modal(html){document.getElementById('modalBody').innerHTML='<div class="grab"></div>'+html;document.getElementById('modal').classList.add('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nowInput(ms=Date.now()){let d=new Date(ms);let local=new Date(ms-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,16)}
function timeInput(ms=Date.now()){return hm(round5(ms))}
function timeOnDay(value,dayMs=Date.now()){let m=/^(\d{1,2}):(\d{2})$/.exec(value||'');if(!m)return NaN;let d=new Date(dayMs);d.setHours(Number(m[1]),Number(m[2]),0,0);return d.getTime()}
function androidBack(){let m=document.getElementById('modal');if(m&&m.classList.contains('show')){closeModal();return}if(currentPage!=='Today')goAppBack()}

function render(){document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());renderToday();renderBookings();renderTariffs();renderHistory()}
function renderTick(){document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());renderToday();if(currentPage==='History')renderHistory()}
function renderToday(){
 let inv=TYPES.map(t=>`<div class="row"><div style="font-size:23px">${t.icon}</div><div class="grow"><div class="name">${t.name}</div><div class="sub">На воде: ${activeQty(t.id)}</div></div><div class="count">${freeQty(t.id)} / ${S.inventory[t.id]}</div></div>`).join('');
 let today=dateKey();let upcoming=S.bookings.filter(b=>b.status==='active'&&dateKey(b.start)===today).sort((a,b)=>a.start-b.start).slice(0,4);
 let bhtml=upcoming.length?upcoming.map(b=>{let late=Date.now()>b.start;let delta=Math.round(Math.abs(b.start-Date.now())/60000);return `<div class="row"><div class="grow"><div class="name">${hm(b.start)} <span class="pill ${late?'danger':'warn'}">${late?'время прошло':'через '+duration(delta)}</span></div><div class="sub">${esc(itemText(b.items))} · ${duration(b.duration)}</div>${b.name?`<div class="sub">${esc(b.name)}</div>`:''}${Number(b.prepaid)>0?`<div class="sub"><b>Предоплата: ${money(b.prepaid)} ₴</b></div>`:''}${b.note?`<div class="sub">📝 ${esc(b.note)}</div>`:''}</div><div class="hist-actions"><button class="action" onclick="startBooking('${b.id}')">СТАРТ</button><button class="histdel" onclick="askDeleteBooking('${b.id}')" aria-label="Удалить бронь">🗑</button></div></div>`}).join(''):'<div class="empty">На сегодня броней нет</div>';
 let rhtml=S.rentals.length?S.rentals.slice().sort((a,b)=>b.start-a.start).map(r=>{let m=elapsed(r.start),bm=billedMinutes(m),pre=Number(r.prepaid)||0;return `<div class="row"><div class="grow"><div class="rental-time">${hm5(r.start)}</div><div class="name" style="margin-top:3px">${esc(itemText(r.items))}</div><div class="sub">Фактически ${duration(m)} <span class="arrow">→</span> расчёт ${bm?duration(bm):'проба'}</div>${pre>0?`<div class="sub"><b>Предоплата: ${money(pre)} ₴</b></div>`:''}${r.note?`<div class="sub">📝 ${esc(r.note)}</div>`:''}</div><div class="hist-actions"><button class="action primary" onclick="finishRental('${r.id}')">ЗАВЕРШИТЬ</button><button class="histdel" onclick="askDeleteRental('${r.id}')" aria-label="Удалить прокат">🗑</button></div></div>`}).join(''):'<div class="empty">Сейчас никто не на воде</div>';
 let warn=inventoryWarnings();
 document.getElementById('pageToday').innerHTML=`${warn?`<div class="hero-note">⚠️ ${warn}</div>`:''}<div class="section"><div class="section-head"><div class="section-title">Инвентарь сегодня</div><button class="linkbtn" onclick="editInventory()">Изменить</button></div><div class="card">${inv}</div></div><div class="section"><div class="section-head"><div class="section-title">Ближайшие брони</div><button class="linkbtn" onclick="setPage('Bookings')">Все</button></div><div class="card">${bhtml}</div></div><div class="section"><div class="section-head"><div class="section-title">На воде</div></div><div class="card">${rhtml}</div></div><button class="big-add" onclick="newRental()">＋ НОВЫЙ ПРОКАТ</button>`
}
function inventoryWarnings(){let now=Date.now(), horizon=now+2*3600000;let b=S.bookings.filter(x=>x.status==='active'&&x.start>=now&&x.start<=horizon).sort((a,b)=>a.start-b.start);let out=[];for(let x of b){for(let t of TYPES){let q=x.items[t.id]||0;if(q>freeQty(t.id))out.push(`${hm(x.start)} бронь ${q} × ${t.name}, свободно ${freeQty(t.id)}`)}}return out[0]||''}

function editInventory(){let rows=TYPES.map(t=>`<div class="item-step"><div class="grow"><div class="name">${t.name}</div><div class="sub">Сейчас на воде: ${activeQty(t.id)}</div></div><button class="step" onclick="stepInv('${t.id}',-1)">−</button><div class="q" id="inv_${t.id}">${S.inventory[t.id]}</div><button class="step" onclick="stepInv('${t.id}',1)">+</button></div>`).join('');modal(`<div class="modal-head"><h2>Инвентарь на сегодня</h2><button class="x" onclick="closeModal()">×</button></div><div class="card">${rows}</div><button class="save" onclick="saveInventory()">ГОТОВО</button>`)}
function stepInv(tid,d){let e=document.getElementById('inv_'+tid);let n=Math.max(activeQty(tid),parseInt(e.textContent||0)+d);e.textContent=n}
function saveInventory(){for(let t of TYPES)S.inventory[t.id]=parseInt(document.getElementById('inv_'+t.id).textContent||0);save();closeModal();render();toast('Инвентарь сохранён')}

function qtyEditor(prefix,base={}){return TYPES.map(t=>`<div class="item-step"><div class="grow"><div class="name">${t.name}</div><div class="sub">Свободно сейчас: ${freeQty(t.id)}</div></div><button class="step" onclick="stepQ('${prefix}','${t.id}',-1)">−</button><div class="q" id="${prefix}_${t.id}">${base[t.id]||0}</div><button class="step" onclick="stepQ('${prefix}','${t.id}',1)">+</button></div>`).join('')}
function stepQ(prefix,tid,d){let e=document.getElementById(prefix+'_'+tid), n=Math.max(0,parseInt(e.textContent||0)+d);e.textContent=n;if(prefix==='nr')showRentalWarn()}
function collect(prefix){let o={};for(let t of TYPES)o[t.id]=parseInt(document.getElementById(prefix+'_'+t.id)?.textContent||0);return o}
function anyItems(o){return Object.values(o).some(x=>x>0)}
function newRental(base={},start=Date.now(),opts={}){let prepaid=Number(opts.prepaid)||0,note=opts.note||'';modal(`<div class="modal-head"><h2>Новый прокат</h2><button class="x" onclick="closeModal()">×</button></div><div class="field"><label>Время начала</label><input id="nr_start" class="input" type="time" value="${timeInput(start)}"></div><div class="section-title" style="margin:14px 2px 7px">Что выдаём</div><div class="card">${qtyEditor('nr',base)}</div><div class="field"><label>Предоплата, ₴ (необязательно)</label><input id="nr_prepaid" class="input" inputmode="decimal" placeholder="0" value="${prepaid>0?money(prepaid):''}"></div><div class="field"><label>Заметка (необязательно)</label><textarea id="nr_note" class="input" rows="2" placeholder="Например: парень в красной кепке">${esc(note)}</textarea></div><div id="nr_warn"></div><button class="save" onclick="createRental()">НАЧАТЬ ПРОКАТ</button>`);showRentalWarn()}
function showRentalWarn(){let host=document.getElementById('nr_warn');if(!host)return;let o=collect('nr'),msgs=[];for(let t of TYPES){let q=o[t.id]||0;if(q>freeQty(t.id))msgs.push(`Не хватает ${t.name}: свободно ${freeQty(t.id)}, выбрано ${q}.`)}let now=Date.now(),today=dateKey();for(let b of S.bookings.filter(b=>b.status==='active'&&dateKey(b.start)===today&&b.start>=now).sort((a,b)=>a.start-b.start).slice(0,3)){for(let t of TYPES){let q=o[t.id]||0,bq=b.items[t.id]||0;if(bq&&freeQty(t.id)-q<bq)msgs.push(`В ${hm(b.start)} бронь ${bq} × ${t.name}; после выдачи останется ${Math.max(0,freeQty(t.id)-q)}.`)}}host.innerHTML=msgs.length?`<div class="hero-note" style="margin-top:10px">⚠️ ${esc(msgs[0])}</div>`:''}
function createRental(){let items=collect('nr');if(!anyItems(items))return toast('Выбери инвентарь');let start=timeOnDay(document.getElementById('nr_start').value,Date.now());if(!start||isNaN(start))start=Date.now();start=round5(start);let shortages=TYPES.filter(t=>(items[t.id]||0)>freeQty(t.id));if(shortages.length&&!confirm('Инвентаря физически не хватает. Всё равно создать прокат?'))return;let raw=(document.getElementById('nr_prepaid').value||'').trim().replace(',','.'),prepaid=raw===''?0:Math.max(0,parseFloat(raw)||0),note=document.getElementById('nr_note').value.trim(),rid=id();S.rentals.push({id:rid,start,items,prepaid,note});save();closeModal();render();toast('Прокат начат')}

function finishRental(rid){let r=S.rentals.find(x=>x.id===rid);if(!r)return;let end=round5(Date.now()),m=elapsed(r.start,end),bm=billedMinutes(m),sum=billFor(r.items,bm),pre=Number(r.prepaid)||0;modal(`<div class="modal-head"><h2>Завершение проката</h2><button class="x" onclick="closeModal()">×</button></div><div class="name">${esc(itemText(r.items))}</div>${r.note?`<div class="sub" style="margin-top:5px">📝 ${esc(r.note)}</div>`:''}<div class="grid2"><div class="field"><label>Начало</label><input class="input" value="${hm5(r.start)}" disabled></div><div class="field"><label>Возврат</label><input id="fr_end" class="input" type="time" value="${timeInput(end)}" onchange="recalcFinish('${rid}')"></div></div><div id="fr_calc"></div><div class="field"><label>Предоплата, ₴</label><input id="fr_prepaid" class="input" inputmode="decimal" placeholder="0" value="${pre>0?money(pre):''}" oninput="recalcPayment('${rid}')"></div><div class="field"><label>Итоговая стоимость, ₴</label><input id="fr_sum" class="input" inputmode="decimal" placeholder="0" value="${sum>0?money(sum):''}" oninput="recalcPayment('${rid}')"></div><div id="fr_payment"></div><button class="save" onclick="commitFinish('${rid}')">ЗАВЕРШИТЬ ПРОКАТ</button>`);recalcFinish(rid,true)}
function recalcFinish(rid,initial=false){let r=S.rentals.find(x=>x.id===rid);if(!r)return;let end=timeOnDay(document.getElementById('fr_end').value,r.start);if(!end||isNaN(end))end=Date.now();end=round5(end);document.getElementById('fr_end').value=hm(end);let m=elapsed(r.start,end),bm=billedMinutes(m),sum=billFor(r.items,bm);document.getElementById('fr_calc').innerHTML=`<div class="calc"><div class="calc-line"><span>Фактически</span><b>${duration(m)}</b></div><div class="calc-line"><span>К оплате по времени</span><b>${bm?duration(bm):'проба / без оплаты'}</b></div><div class="calc-line calc-total"><span>Расчёт по тарифу</span><span>${money(sum)} ₴</span></div></div>`;if(!initial)document.getElementById('fr_sum').value=sum>0?money(sum):'';recalcPayment(rid)}
function recalcPayment(rid){let r=S.rentals.find(x=>x.id===rid);if(!r)return;let preEl=document.getElementById('fr_prepaid'),sumEl=document.getElementById('fr_sum'),host=document.getElementById('fr_payment');if(!preEl||!sumEl||!host)return;let p=paymentBreakdown(parseFloat((sumEl.value||'0').replace(',','.')),parseFloat((preEl.value||'0').replace(',','.')));host.innerHTML=`<div class="calc"><div class="calc-line"><span>Полная стоимость</span><b>${money(p.total)} ₴</b></div><div class="calc-line"><span>Предоплата</span><b>${money(p.prepaid)} ₴</b></div><div class="calc-line calc-total"><span>Осталось доплатить</span><span>${money(p.left)} ₴</span></div>${p.over>0?`<div class="calc-line"><span>Переплата</span><b>${money(p.over)} ₴</b></div>`:''}</div>`}
function commitFinish(rid){let i=S.rentals.findIndex(x=>x.id===rid);if(i<0)return;let r=S.rentals[i],end=timeOnDay(document.getElementById('fr_end').value,r.start);if(!end||isNaN(end))end=Date.now();end=round5(end);if(end<r.start)return toast('Возврат раньше начала');let m=elapsed(r.start,end),bm=billedMinutes(m),calc=billFor(r.items,bm),raw=(document.getElementById('fr_sum').value||'').trim().replace(',','.'),sum=raw===''?calc:Math.max(0,parseFloat(raw)||0),preRaw=(document.getElementById('fr_prepaid').value||'').trim().replace(',','.'),prepaid=preRaw===''?0:Math.max(0,parseFloat(preRaw)||0);S.rentals.splice(i,1);S.history.unshift({id:id(),kind:'finish',rentalId:r.id,bookingId:r.bookingId||null,at:Date.now(),start:r.start,end,items:r.items,minutes:m,billed:bm,calc,sum,prepaid,note:r.note||''});save();closeModal();render();toast('Прокат завершён')}

function renderBookings(){let arr=S.bookings.filter(b=>b.status==='active').sort((a,b)=>a.start-b.start);let cards=arr.length?arr.map(b=>`<div class="row"><div class="grow"><div class="name">${new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit'}).format(new Date(b.start))} · ${hm(b.start)}</div><div class="sub">${esc(itemText(b.items))} · ${duration(b.duration)}</div>${b.name?`<div class="sub">${esc(b.name)}${b.phone?' · '+esc(b.phone):''}</div>`:''}${Number(b.prepaid)>0?`<div class="sub"><b>Предоплата: ${money(b.prepaid)} ₴</b></div>`:''}${b.note?`<div class="sub">📝 ${esc(b.note)}</div>`:''}</div><div class="hist-actions"><button class="action" onclick="startBooking('${b.id}')">СТАРТ</button><button class="histdel" onclick="askDeleteBooking('${b.id}')" aria-label="Удалить бронь">🗑</button></div></div>`).join(''):'<div class="empty">Активных броней нет</div>';document.getElementById('pageBookings').innerHTML=`<div class="section"><div class="section-head"><div class="section-title">Брони</div></div><div class="card">${cards}</div></div><button class="big-add" onclick="newBooking()">＋ НОВАЯ БРОНЬ</button>`}
function newBooking(){let d=new Date(Date.now()+3600000);d.setMinutes(Math.ceil(d.getMinutes()/30)*30,0,0);modal(`<div class="modal-head"><h2>Новая бронь</h2><button class="x" onclick="closeModal()">×</button></div><div class="field"><label>Дата и время</label><input id="nb_start" class="input" type="datetime-local" value="${nowInput(d.getTime())}"></div><div class="field"><label>Длительность</label><select id="nb_dur" class="input">${[30,60,90,120,150,180,240].map(x=>`<option value="${x}" ${x===60?'selected':''}>${duration(x)}</option>`).join('')}</select></div><div class="section-title" style="margin:14px 2px 7px">Инвентарь</div><div class="card">${qtyEditor('nb',{})}</div><div class="field"><label>Имя (необязательно)</label><input id="nb_name" class="input" placeholder="Например, Иван"></div><div class="field"><label>Телефон (необязательно)</label><input id="nb_phone" class="input" inputmode="tel" placeholder="+380..."></div><div class="field"><label>Предоплата, ₴ (необязательно)</label><input id="nb_prepaid" class="input" inputmode="decimal" placeholder="0"></div><div class="field"><label>Заметка (необязательно)</label><textarea id="nb_note" class="input" rows="2" placeholder="Как узнать клиента / важная деталь"></textarea></div><button class="save" onclick="createBooking()">СОХРАНИТЬ БРОНЬ</button>`)}
function createBooking(){let items=collect('nb');if(!anyItems(items))return toast('Выбери инвентарь');let start=new Date(document.getElementById('nb_start').value).getTime();if(!start||isNaN(start))return toast('Укажи время');let durationMin=parseInt(document.getElementById('nb_dur').value),raw=(document.getElementById('nb_prepaid').value||'').trim().replace(',','.'),prepaid=raw===''?0:Math.max(0,parseFloat(raw)||0),note=document.getElementById('nb_note').value.trim();let bid=id();S.bookings.push({id:bid,start,duration:durationMin,items,name:document.getElementById('nb_name').value.trim(),phone:document.getElementById('nb_phone').value.trim(),prepaid,note,status:'active'});S.history.unshift({id:id(),kind:'booking',bookingId:bid,at:Date.now(),start,items,prepaid,note});save();closeModal();render();toast('Бронь сохранена')}
function startBooking(bid){let b=S.bookings.find(x=>x.id===bid);if(!b)return;b.status='started';let rid=id(),started=round5(Date.now());S.rentals.push({id:rid,start:started,items:{...b.items},bookingId:b.id,prepaid:Number(b.prepaid)||0,note:b.note||''});save();render();toast('Бронь переведена в прокат')}

function renderTariffs(){let rows=TYPES.map(t=>{let v=S.tariffs[t.id]&&S.tariffs[t.id].p60!=null?S.tariffs[t.id].p60:'';return `<div class="tariff-grid"><div><div class="name">${t.name}</div></div><input class="input tariff60" data-id="${t.id}" inputmode="decimal" placeholder="0" value="${v}"></div>`}).join('');document.getElementById('pageTariffs').innerHTML=`<div class="section"><div class="section-head"><div class="section-title">Тарифы</div></div><div class="card"><div class="tariff-grid"><div class="hdr">Инвентарь</div><div class="hdr" style="text-align:right">1 час, ₴</div></div>${rows}</div><button class="save" onclick="saveTariffs()">СОХРАНИТЬ ТАРИФЫ</button></div>`}
function saveTariffs(){for(let t of TYPES){let e=document.querySelector(`.tariff60[data-id="${t.id}"]`),raw=e.value.trim().replace(',','.');S.tariffs[t.id]={p60:raw===''?null:Math.max(0,Number(raw)||0)}}save();render();toast('Тарифы сохранены')}

function askDeleteHistory(hid){let h=S.history.find(x=>x.id===hid);if(!h)return;
 if(h.kind==='booking'&&h.bookingId){let b=S.bookings.find(x=>x.id===h.bookingId);if(b)return askDeleteBooking(b.id)}
 let whole=h.kind==='finish'&&h.rentalId;modal(`<div class="modal-head"><h2>${whole?'Удалить прокат?':'Удалить запись?'}</h2><button class="x" onclick="closeModal()">×</button></div><div class="danger-note">${whole?'Будет удалён весь завершённый прокат.':'Запись будет удалена. Действие нельзя отменить.'}</div><button class="save danger" onclick="commitDeleteHistory('${hid}')">УДАЛИТЬ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitDeleteHistory(hid){let h=S.history.find(x=>x.id===hid);if(!h)return;if(h.kind==='finish'&&h.rentalId){let rid=h.rentalId;S.history=S.history.filter(x=>x.rentalId!==rid&&x.id!==hid);S.rentals=S.rentals.filter(x=>x.id!==rid)}else S.history=S.history.filter(x=>x.id!==hid);save();closeModal();render();toast(h.kind==='finish'?'Прокат удалён':'Запись удалена')}
function compactHistoryRows(list){return (list||[]).filter(h=>h.kind!=='start'&&h.kind!=='booking_start')}
function itemsEqual(a={},b={}){return TYPES.every(t=>(a[t.id]||0)===(b[t.id]||0))}
function askDeleteRental(rid){let r=S.rentals.find(x=>x.id===rid);if(!r)return;modal(`<div class="modal-head"><h2>Удалить прокат?</h2><button class="x" onclick="closeModal()">×</button></div><div class="name">${esc(itemText(r.items))}</div><div class="danger-note">Прокат будет полностью удалён как ошибочная запись. Инвентарь сразу снова станет свободным, отсчёт времени прекратится, а в истории ничего не останется.</div><button class="save danger" onclick="commitDeleteRental('${rid}')">УДАЛИТЬ ПРОКАТ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitDeleteRental(rid){let r=S.rentals.find(x=>x.id===rid);if(!r)return;S.rentals=S.rentals.filter(x=>x.id!==rid);if(r.bookingId){let b=S.bookings.find(x=>x.id===r.bookingId);if(b&&b.status==='started')b.status='active'}S.history=S.history.filter(h=>h.rentalId!==rid&&!(h.kind==='start'&&h.start===r.start&&itemsEqual(h.items,r.items))&&!(h.kind==='booking_start'&&r.bookingId&&h.bookingId===r.bookingId));save();closeModal();render();toast('Прокат удалён')}
function askDeleteBooking(bid){let b=S.bookings.find(x=>x.id===bid);if(!b)return;modal(`<div class="modal-head"><h2>Удалить бронь?</h2><button class="x" onclick="closeModal()">×</button></div><div class="name">${hm(b.start)} · ${esc(itemText(b.items))}</div><div class="danger-note">Бронь и связанные с ней данные будут удалены полностью. Это действие нельзя отменить.</div><button class="save danger" onclick="commitDeleteBooking('${bid}')">УДАЛИТЬ БРОНЬ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitDeleteBooking(bid){let b=S.bookings.find(x=>x.id===bid);if(!b)return;let linkedRentals=S.rentals.filter(r=>r.bookingId===bid).map(r=>r.id);S.rentals=S.rentals.filter(r=>r.bookingId!==bid);S.bookings=S.bookings.filter(x=>x.id!==bid);S.history=S.history.filter(h=>h.bookingId!==bid&&!linkedRentals.includes(h.rentalId));save();closeModal();render();toast('Бронь удалена')}
function historyRow(h,allowDelete=true){let title='',sub='',right='';if(h.kind==='finish'){title=`${hm5(h.start)} → ${hm5(h.end)} · ${itemText(h.items)}`;sub=`Факт ${duration(h.minutes)} · расчёт ${h.billed?duration(h.billed):'проба'}${Number(h.prepaid)>0?' · предоплата '+money(h.prepaid)+' ₴':''}${h.note?' · 📝 '+h.note:''}`;right=`<div class="price">${money(h.sum)} ₴</div>`}else if(h.kind==='booking_cancel'){title='Бронь отменена';sub=`${hm(h.start)} · ${itemText(h.items)}`;right='<span class="history-tag danger-text">ОТМЕНА</span>'}else if(h.kind==='booking'){title='Бронь создана';sub=`${new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit'}).format(new Date(h.start))} ${hm(h.start)} · ${itemText(h.items)}`;right='<span class="history-tag">БРОНЬ</span>'}else{return ''}return `<div class="row"><div class="grow"><div class="name" style="font-size:14px">${esc(title)}</div><div class="sub">${esc(sub)}</div></div><div class="hist-actions">${right}${allowDelete?`<button class="histdel" onclick="askDeleteHistory('${h.id}')" aria-label="Удалить запись">🗑</button>`:''}</div></div>`}
function activeHistoryRow(r){let m=elapsed(r.start),bm=billedMinutes(m),pre=Number(r.prepaid)||0;return `<div class="row"><div class="grow"><div class="name" style="font-size:14px">${hm5(r.start)} · ${esc(itemText(r.items))}</div><div class="sub">На воде ${duration(m)} · расчёт ${bm?duration(bm):'проба'}${pre>0?' · предоплата '+money(pre)+' ₴':''}</div>${r.note?`<div class="sub">📝 ${esc(r.note)}</div>`:''}</div><div class="hist-actions"><span class="history-tag">НА ВОДЕ</span><button class="histdel" onclick="askDeleteRental('${r.id}')" aria-label="Удалить прокат">🗑</button></div></div>`}
function reportStats(data){let fin=(data.history||[]).filter(h=>h.kind==='finish'),revenue=fin.reduce((a,h)=>a+(Number(h.sum)||0),0);return {fin:fin.length,revenue,active:(data.rentals||[]).length,bookings:(data.bookings||[]).filter(b=>b.status==='active').length}}
function reportDate(ms){return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ms))}
function renderUpdateCard(){
 let title='Установлена версия '+APP_VERSION,message=U.message||'Проверка выполняется через GitHub Releases.',progress='',button=`<button class="action" onclick="checkForUpdates(true)">ПРОВЕРИТЬ ОБНОВЛЕНИЯ</button>`;
 if(U.status==='checking'){
  message='Проверяю GitHub…';button='<button class="action" disabled>ПРОВЕРЯЮ…</button>'

 }else if(U.status==='installing'){
  title=`Установка версии ${esc(U.versionName||'')}`;message=U.message||'Открыт системный установщик Android.';button='<button class="action primary" disabled>УСТАНОВЩИК ОТКРЫТ</button>'
 }else if(U.status==='permission'){
  title='Нужно разрешение на установку';message=U.message||'Разреши установку приложений из этого источника и вернись в SUP Place.';button='<button class="action primary" onclick="startAppUpdate()">ПРОДОЛЖИТЬ УСТАНОВКУ</button>'
 }else if(U.available){
  title=`Доступна версия ${esc(U.versionName)}`;message=U.changelog||U.message||'Доступно новое обновление SUP Place.';button=`<button class="action primary" onclick="startAppUpdate()">${U.status==='error'?'ПОВТОРИТЬ':'СКАЧАТЬ И УСТАНОВИТЬ'}</button>`
 }else if(U.status==='ready'){
  message='Установлена последняя версия.'
 }
 return `<div class="update-panel"><div class="name ${U.available?'update-available':''}">${title}</div><div class="update-message">${esc(message)}</div>${progress}${button}</div>`
}
function checkForUpdates(manual=false){if(['checking','downloading','installing'].includes(U.status))return;if(!(window.Android&&typeof Android.checkForUpdate==='function')){if(manual)toast('Проверка обновлений недоступна');return}U={...U,status:'checking',message:'Проверяю GitHub…'};renderHistory();Android.checkForUpdate()}
function onUpdateCheckResult(raw){try{let x=JSON.parse(raw);if(!x.ok){U={...U,status:'error',available:false,message:x.message||'Не удалось проверить обновления'};renderHistory();return}localStorage.setItem(UPDATE_CHECK_KEY,String(Date.now()));U={status:'ready',available:!!x.available,versionName:x.versionName||'',apkUrl:x.apkUrl||'',sha256:x.sha256||'',changelog:x.changelog||'',message:''};renderHistory();if(U.available)toast('Доступно обновление '+U.versionName)}catch(e){U={...U,status:'error',message:'Не удалось обработать ответ обновления'};renderHistory()}}
function startAppUpdate(){if(['downloading','installing','checking'].includes(U.status)||!U.available||!U.apkUrl||!U.sha256)return;if(!(window.Android&&typeof Android.downloadAndInstallUpdate==='function'))return toast('Установка обновлений недоступна');U={...U,status:'downloading',message:'Обновление скачивается…'};renderHistory();Android.downloadAndInstallUpdate(U.apkUrl,U.versionName,U.sha256)}
function onUpdateDownloadState(state,message){U={...U,status:state,message:message||''};renderHistory();if(message)toast(message)}
function autoCheckForUpdates(){let last=Number(localStorage.getItem(UPDATE_CHECK_KEY))||0;if(Date.now()-last>=24*60*60*1000)checkForUpdates(false)}
function renderHistory(){let activeRows=S.rentals.slice().sort((a,b)=>b.start-a.start).map(activeHistoryRow).join('');let durableRows=compactHistoryRows(S.history).slice(0,100).map(h=>historyRow(h,true)).join('');let rows=activeRows+durableRows;let received=R.map(r=>{let st=reportStats(r.data||{});return `<div class="report-card"><div class="report-top"><div class="report-meta"><div class="name" style="font-size:15px">Отчёт · ${esc(reportDate(r.exportedAt||r.importedAt))}</div><div class="sub">Получен ${esc(reportDate(r.importedAt))}</div></div><button class="histdel" onclick="deleteReceivedReport('${r.id}')" aria-label="Удалить отчёт">🗑</button></div><div class="report-card-actions"><button class="action" onclick="openReceivedReport('${r.id}')">ОТКРЫТЬ</button><button class="action" onclick="askRestoreReport('${r.id}')">ВОССТАНОВИТЬ</button></div><div class="report-stats"><div class="report-stat"><b>${st.fin}</b><span>прокатов</span></div><div class="report-stat"><b>${money(st.revenue)} ₴</b><span>выручка</span></div><div class="report-stat"><b>${st.active}</b><span>на воде</span></div></div></div>`}).join('');document.getElementById('pageHistory').innerHTML=`<div class="section"><div class="section-head"><div class="section-title">Обновления</div></div><div class="card">${renderUpdateCard()}</div></div><div class="section"><div class="section-head"><div class="section-title">Передача отчёта</div></div><div class="card"><div class="report-actions"><button class="report-btn send" onclick="sendReport()">ОТПРАВИТЬ ОТЧЁТ</button><button class="report-btn import" onclick="importReportFile()">ИМПОРТИРОВАТЬ</button></div><div style="padding:0 12px 12px"><button class="save danger" style="margin-top:0" onclick="askClearRecords()">ОЧИСТИТЬ ЗАПИСИ</button></div></div><div class="report-note">Отчёт содержит текущие прокаты, брони, тарифы и историю. Импортированный отчёт не перезаписывает рабочие данные на этом телефоне.</div></div>${R.length?`<div class="section"><div class="section-head"><div class="section-title">Полученные отчёты</div></div><div class="card">${received}</div></div>`:''}<div class="section"><div class="section-head"><div class="section-title">История</div></div><div class="card">${rows||'<div class="empty">История пока пустая</div>'}</div></div>`}
function askClearRecords(){let total=S.rentals.length+S.bookings.length+compactHistoryRows(S.history).length;modal(`<div class="modal-head"><h2>Очистить все записи?</h2><button class="x" onclick="closeModal()">×</button></div><div class="danger-note">Будут удалены все прокаты, активные брони и история на этом телефоне${total?` (${total})`:''}. Тарифы, количество инвентаря и полученные отчёты сохранятся.</div><button class="save danger" onclick="commitClearRecords()">ОЧИСТИТЬ ВСЁ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitClearRecords(){S.rentals=[];S.bookings=[];S.history=[];save();closeModal();render();toast('Все записи очищены')}
function sendReport(){let payload={format:'SUP_PLACE_REPORT',version:2,formatVersion:2,exportedAt:Date.now(),data:S};let d=new Date(),pad=n=>String(n).padStart(2,'0'),fn=`SUP_Place_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.supplace.json`;let txt=JSON.stringify(payload);if(window.Android&&typeof Android.exportReport==='function'){Android.exportReport(txt,fn)}else{modal(`<div class="modal-head"><h2>Отчёт</h2><button class="x" onclick="closeModal()">×</button></div><div class="sub">Системная отправка недоступна. Ниже техническая копия.</div><textarea class="input" style="height:260px;margin-top:10px;font-family:monospace;font-size:11px" readonly>${esc(txt)}</textarea>`)} }
function importReportFile(){if(window.Android&&typeof Android.importReport==='function')Android.importReport();else toast('Импорт файла недоступен')}
function reportExported(){toast('Отчёт создан — выбери, куда отправить')}
function reportExportFailed(){toast('Не удалось создать файл отчёта')}
function reportImportFailed(){toast('Не удалось прочитать файл')}
function consumeNativeImport(){try{if(window.Android&&typeof Android.takeImportedReport==='function'){let txt=Android.takeImportedReport();if(txt)receiveImportedReport(String(txt))}}catch(e){toast('Не удалось импортировать отчёт')}}
function receiveImportedReport(txt){try{let p=JSON.parse(txt),data;if(p&&p.format==='SUP_PLACE_REPORT'&&p.data)data=p.data;else if(p&&p.inventory)data=p;else throw new Error('format');data=migrateState(JSON.parse(JSON.stringify(data)));let exportedAt=(p&&p.exportedAt)||Date.now(),rid='rep_'+exportedAt+'_'+Math.random().toString(36).slice(2,7);R.unshift({id:rid,importedAt:Date.now(),exportedAt,data,formatVersion:(p&&p.formatVersion)||(p&&p.version)||1});let persisted=saveReports();render();openReceivedReport(rid);toast(persisted?'Отчёт импортирован':'Отчёт открыт, но слишком большой для постоянного хранения')}catch(e){toast('Это не файл отчёта SUP Place')}}
function askRestoreReport(rid){let r=R.find(x=>x.id===rid);if(!r)return;modal(`<div class="modal-head"><h2>Восстановить данные?</h2><button class="x" onclick="closeModal()">×</button></div><div class="danger-note">Рабочие прокаты, брони, история, тарифы и количество инвентаря на этом телефоне будут заменены данными из выбранного отчёта.</div><button class="save" onclick="commitRestoreReport('${rid}')">ВОССТАНОВИТЬ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitRestoreReport(rid){let r=R.find(x=>x.id===rid);if(!r||!r.data)return;try{S=migrateState(JSON.parse(JSON.stringify(r.data)));save();closeModal();render();setPage('Today');toast('Рабочие данные восстановлены')}catch(e){toast('Отчёт повреждён')}}
function deleteReceivedReport(rid){let r=R.find(x=>x.id===rid);if(!r)return;modal(`<div class="modal-head"><h2>Удалить отчёт?</h2><button class="x" onclick="closeModal()">×</button></div><div class="danger-note">Удалится только полученная копия отчёта. Рабочие данные приложения не изменятся.</div><button class="save danger" onclick="commitDeleteReceivedReport('${rid}')">УДАЛИТЬ</button><button class="save secondary" onclick="closeModal()">ОТМЕНА</button>`)}
function commitDeleteReceivedReport(rid){R=R.filter(x=>x.id!==rid);saveReports();closeModal();render();toast('Отчёт удалён')}
function openReceivedReport(rid){let r=R.find(x=>x.id===rid);if(!r)return;let d=r.data||{},st=reportStats(d),active=(d.rentals||[]).map(x=>`<div class="row"><div class="grow"><div class="name" style="font-size:14px">${hm5(x.start)} · ${esc(itemText(x.items))}</div><div class="sub">На воде ${duration(elapsed(x.start,r.exportedAt||Date.now()))}</div>${Number(x.prepaid)>0?`<div class="sub"><b>Предоплата: ${money(x.prepaid)} ₴</b></div>`:''}${x.note?`<div class="sub">📝 ${esc(x.note)}</div>`:''}</div></div>`).join(''),books=(d.bookings||[]).filter(b=>b.status==='active').sort((a,b)=>a.start-b.start).map(b=>`<div class="row"><div class="grow"><div class="name" style="font-size:14px">${esc(reportDate(b.start))}</div><div class="sub">${esc(itemText(b.items))} · ${duration(b.duration)}</div>${b.name?`<div class="sub">${esc(b.name)}${b.phone?' · '+esc(b.phone):''}</div>`:''}${Number(b.prepaid)>0?`<div class="sub"><b>Предоплата: ${money(b.prepaid)} ₴</b></div>`:''}${b.note?`<div class="sub">📝 ${esc(b.note)}</div>`:''}</div></div>`).join(''),hist=compactHistoryRows(d.history||[]).slice(0,100).map(h=>historyRow(h,false)).join('');modal(`<div class="modal-head"><h2>Отчёт SUP Place</h2><button class="x" onclick="closeModal()">×</button></div><div class="sub">Состояние на ${esc(reportDate(r.exportedAt))}</div><div class="report-stats" style="margin:12px 0"><div class="report-stat"><b>${st.fin}</b><span>прокатов</span></div><div class="report-stat"><b>${money(st.revenue)} ₴</b><span>выручка</span></div><div class="report-stat"><b>${st.active}</b><span>на воде</span></div></div>${active?`<div class="section-title" style="margin:14px 2px 7px">На воде</div><div class="card">${active}</div>`:''}${books?`<div class="section-title" style="margin:14px 2px 7px">Активные брони</div><div class="card">${books}</div>`:''}<div class="section-title" style="margin:14px 2px 7px">История</div><div class="report-history">${hist||'<div class="empty">История пустая</div>'}</div>`)}


save();render();clearInterval(timer);timer=setInterval(renderTick,30000);setTimeout(consumeNativeImport,180);setTimeout(autoCheckForUpdates,700);

</script>
</body></html>
